name: EV Dashboard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Zero Emojis and Zero Badges
      run: |
        python -c "
        import os, re
        emoji_pattern = re.compile(r'[\U00010000-\U0010ffff]|[\u2600-\u27bf]|[\ud83c-\ud83e]')
        for root, _, files in os.walk('.'):
            if any(p in root for p in ['.git', 'venv', '.venv', '__pycache__', 'assets']):
                continue
            for f in files:
                if f.endswith(('.py', '.md', '.toml', '.txt')):
                    with open(os.path.join(root, f), 'r', encoding='utf-8', errors='ignore') as fh:
                        matches = emoji_pattern.findall(fh.read())
                        assert len(matches) == 0, f'Emoji detected in {f}: {matches}'
        print('Zero emojis verified across codebase.')
        "

    - name: Run Test Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v
